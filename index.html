<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b42318" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CalmAid" />
    <meta name="description" content="CalmAid: calm, step-by-step first-aid guidance for lay people in stressful moments." />
    <title>CalmAid: calm first-aid guide</title>
    <script>
      // Apply a saved theme before first paint (no flash at night).
      try {
        var t = JSON.parse(localStorage.getItem('calmaid.settings') || '{}').theme;
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
